name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openmv
          POSTGRES_USER: openmv
          POSTGRES_PASSWORD: openmv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Test (pytest)
        run: uv run pytest
        env:
          SECRET_KEY: ci-test-key
          DJANGO_SETTINGS_MODULE: openmv.settings.ci
          POSTGRES_DB: openmv
          POSTGRES_USER: openmv
          POSTGRES_PASSWORD: openmv
          SQL_HOST: 127.0.0.1
          SQL_PORT: "5432"
