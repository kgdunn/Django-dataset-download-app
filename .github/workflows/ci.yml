name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openmv
          POSTGRES_USER: openmv
          POSTGRES_PASSWORD: openmv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # TODO(security): swap the floating tags below for full commit SHAs
      # (docs/SECURITY.md → "Issues to file" → action-SHA-pinning) once the
      # maintainer confirms the SHAs. Tags can be re-pointed by the action
      # owner; SHAs cannot.
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure --color always

      - name: Test (pytest)
        run: uv run pytest
        env:
          SECRET_KEY: ci-test-key
          DJANGO_SETTINGS_MODULE: openmv.settings.ci
          POSTGRES_DB: openmv
          POSTGRES_USER: openmv
          POSTGRES_PASSWORD: openmv
          SQL_HOST: 127.0.0.1
          SQL_PORT: "5432"

      - name: Audit dependencies (pip-audit)
        # Non-blocking for now: surfaces known CVEs in the resolved tree
        # without failing the build. Tighten to `--strict` once the
        # baseline is clean.
        continue-on-error: true
        run: uv run pip-audit --progress-spinner=off
