<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
(function () {
    try {
        var t = localStorage.getItem('openmv-theme');
        if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
        }
    } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
    --color-accent:        #1f4e7a;
    --color-accent-hover:  #173a5e;
    --color-accent-fg:     #ffffff;
    --color-accent-soft:   #e7edf4;
    --color-accent-soft-fg:#173a5e;

    --color-bg:            #f7f7f4;
    --color-surface:       #ffffff;
    --color-surface-2:     #eeeee8;
    --color-border:        #e0e0d8;
    --color-border-strong: #cccbc0;

    --color-text:          #1a1d22;
    --color-text-muted:    #4a5560;
    --color-text-subtle:   #6e7780;
    --color-link:          #1f4e7a;
    --color-link-hover:    #173a5e;
    --color-focus:         #2563eb;

    --font-sans:  "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --font-mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --fs-base:   16px;
    --fs-sm:     0.875rem;
    --fs-xs:     0.78125rem;
    --fs-h1:     2rem;
    --fs-h2:     1.5rem;
    --fs-h3:     1.375rem;
    --fs-h4:     1rem;
    --lh-body:   1.55;
    --lh-tight:  1.2;

    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    --radius-sm: 4px;
    --radius:    8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(14,20,20,0.06);
    --shadow:    0 1px 3px rgba(14,20,20,0.08), 0 1px 2px rgba(14,20,20,0.04);
    --transition: 150ms ease;

    --chart-line:        #1f4e7a;
    --chart-area:        rgba(31, 78, 122, 0.16);
    --chart-axis:        #94a3b8;
    --chart-tooltip-bg:  #ffffff;
    --chart-tooltip-fg:  #1a1d22;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --color-accent:        #7ea2c4;
        --color-accent-hover:  #99b6d2;
        --color-accent-fg:     #161b22;
        --color-accent-soft:   #1c2a3d;
        --color-accent-soft-fg:#99b6d2;

        --color-bg:            #161b22;
        --color-surface:       #1e252e;
        --color-surface-2:     #252d38;
        --color-border:        #2d3542;
        --color-border-strong: #3d4658;

        --color-text:          #e6eaed;
        --color-text-muted:    #9aa4ae;
        --color-text-subtle:   #7a8590;
        --color-link:          #7ea2c4;
        --color-link-hover:    #99b6d2;
        --color-focus:         #7ea2c4;

        --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
        --shadow:    0 2px 6px rgba(0,0,0,0.5);

        --chart-line:        #7ea2c4;
        --chart-area:        rgba(126, 162, 196, 0.18);
        --chart-axis:        #475569;
        --chart-tooltip-bg:  #1e252e;
        --chart-tooltip-fg:  #e6eaed;
    }
}
:root[data-theme="dark"] {
    --color-accent:        #7ea2c4;
    --color-accent-hover:  #99b6d2;
    --color-accent-fg:     #161b22;
    --color-accent-soft:   #1c2a3d;
    --color-accent-soft-fg:#99b6d2;

    --color-bg:            #161b22;
    --color-surface:       #1e252e;
    --color-surface-2:     #252d38;
    --color-border:        #2d3542;
    --color-border-strong: #3d4658;

    --color-text:          #e6eaed;
    --color-text-muted:    #9aa4ae;
    --color-text-subtle:   #7a8590;
    --color-link:          #7ea2c4;
    --color-link-hover:    #99b6d2;
    --color-focus:         #7ea2c4;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow:    0 2px 6px rgba(0,0,0,0.5);

    --chart-line:        #7ea2c4;
    --chart-area:        rgba(126, 162, 196, 0.18);
    --chart-axis:        #475569;
    --chart-tooltip-bg:  #1e252e;
    --chart-tooltip-fg:  #e6eaed;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light dark; }
body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    font-size: var(--fs-base);
    line-height: var(--lh-body);
    -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; color: var(--color-link-hover); }
table { border-collapse: collapse; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: 2px; }

h1, h3 {
    font-family: var(--font-serif); font-weight: 600;
    letter-spacing: -0.01em; line-height: var(--lh-tight);
    margin: 0 0 var(--sp-3) 0;
}
h2, h4 {
    font-family: var(--font-sans); font-weight: 600;
    line-height: var(--lh-tight);
    margin: 0 0 var(--sp-3) 0;
}
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
h4 { font-size: var(--fs-h4); color: var(--color-text-muted); }
p  { margin: 0 0 var(--sp-3) 0; }
.eyebrow {
    font-family: var(--font-sans);
    font-size: var(--fs-xs);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-subtle);
    margin: 0 0 var(--sp-2) 0;
}
.numeric, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Chrome */
.site-header {
    position: relative;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
}
.site-header::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--color-accent) 0%, var(--color-accent) 60%, transparent 100%);
}
.site-header__inner {
    max-width: 1100px; margin: 0 auto;
    padding: var(--sp-4);
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
}
@media (min-width: 768px) { .site-header__inner { padding: var(--sp-4) var(--sp-6); } }
.site-title {
    font-family: var(--font-serif);
    font-size: var(--fs-h2); font-weight: 600;
    color: var(--color-text); letter-spacing: -0.015em;
}
.site-title:hover { color: var(--color-accent); text-decoration: none; }
.site-title__dot { color: var(--color-accent); margin: 0 1px; }

.page-container {
    max-width: 1100px; margin: 0 auto;
    padding: var(--sp-5) var(--sp-4);
}
@media (min-width: 768px) { .page-container { padding: var(--sp-6); } }

.site-footer {
    margin-top: var(--sp-8);
    padding: var(--sp-5) var(--sp-4);
    border-top: 1px solid var(--color-border);
    color: var(--color-text-subtle);
    font-size: var(--fs-sm);
    text-align: center;
}
.site-footer p { margin: 0; }
.site-footer a { color: var(--color-text-subtle); text-decoration: underline; }
.site-footer a:hover { color: var(--color-link); }

/* Theme toggle */
.theme-toggle {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 6px var(--sp-3);
    border: 1px solid var(--color-border-strong);
    border-radius: 999px;
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.theme-toggle:hover { background: var(--color-surface-2); color: var(--color-text); border-color: var(--color-accent); }
.theme-toggle__icon {
    width: 14px; height: 14px; display: inline-block;
    background: currentColor;
    -webkit-mask: var(--icon) center/contain no-repeat;
            mask: var(--icon) center/contain no-repeat;
}
.theme-toggle[data-mode="light"] .theme-toggle__icon { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41'/></svg>"); }
.theme-toggle[data-mode="dark"]  .theme-toggle__icon { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z'/></svg>"); }
.theme-toggle[data-mode="auto"]  .theme-toggle__icon { --icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M12 3v18M3 12a9 9 0 0 1 9-9'/></svg>"); }

/* Detail-page top prev / home / next chips.
   CSS grid with three columns (1fr / auto / 1fr) keeps "Back to home"
   centered even when prev or next is missing (a `__spacer` empty
   element fills the cell so the grid track count stays constant). */
.detail-topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--sp-2);
    margin: 0 0 var(--sp-5) 0;
}
.detail-topbar__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px var(--sp-3);
    font-family: var(--font-sans);
    font-size: var(--fs-sm);
    color: var(--color-accent-soft-fg);
    background: var(--color-accent-soft);
    border: 1px solid transparent;
    border-radius: var(--radius);
    line-height: 1.4;
    min-height: 36px;
    white-space: nowrap;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.detail-topbar__btn:hover {
    background: var(--color-accent);
    color: var(--color-accent-fg);
    border-color: var(--color-accent);
    text-decoration: none;
}
.detail-topbar__btn--prev { justify-self: start; }
.detail-topbar__btn--next { justify-self: end; }
.detail-topbar__btn--home {
    justify-self: center;
    font-weight: 600;
    padding: 8px var(--sp-4);
}
.detail-topbar__spacer { display: block; }
@media (max-width: 420px) {
    .detail-topbar { gap: 6px; }
    .detail-topbar__btn { padding: 6px 10px; font-size: var(--fs-xs); }
    .detail-topbar__btn--home { padding: 6px var(--sp-3); }
}

.detail-title {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--sp-3);
    margin: 0 0 var(--sp-3) 0;
}
.detail-title h3 { margin: 0; flex: 1 1 auto; min-width: 0; }
.share-btn {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 4px var(--sp-3);
    border: 1px solid var(--color-border-strong);
    border-radius: 999px;
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.share-btn:hover {
    background: var(--color-surface-2);
    color: var(--color-text);
    border-color: var(--color-accent);
}
.share-btn.is-copied {
    color: var(--color-accent-soft-fg);
    background: var(--color-accent-soft);
    border-color: var(--color-accent);
}
.share-btn__icon {
    width: 14px; height: 14px; display: inline-block;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='18' cy='5' r='3'/><circle cx='6' cy='12' r='3'/><circle cx='18' cy='19' r='3'/><line x1='8.59' y1='13.51' x2='15.42' y2='17.49'/><line x1='15.41' y1='6.51' x2='8.59' y2='10.49'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='18' cy='5' r='3'/><circle cx='6' cy='12' r='3'/><circle cx='18' cy='19' r='3'/><line x1='8.59' y1='13.51' x2='15.42' y2='17.49'/><line x1='15.41' y1='6.51' x2='8.59' y2='10.49'/></svg>") center/contain no-repeat;
}
.share-btn.is-copied .share-btn__icon {
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
}

/* Tag chips — used by both list and detail pages */
.tag-list { display: flex; flex-wrap: wrap; gap: var(--sp-1); min-width: 0; }
.dataset-tag {
    display: inline-flex; align-items: center;
    padding: 2px 10px;
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    line-height: 1.7;
    color: var(--color-accent-soft-fg);
    background: var(--color-accent-soft);
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
    min-width: 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
    transition: background var(--transition), color var(--transition);
}
.dataset-tag:hover { background: var(--color-accent); color: var(--color-accent-fg); text-decoration: none; }

/* Homepage / tag-filter list */
.dataset-results { margin: 0; }
.dataset-table {
    width: 100%; table-layout: fixed;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: var(--fs-sm);
    box-shadow: var(--shadow-sm);
}
.dataset-table thead { background: var(--color-surface-2); }
.dataset-table thead td,
.dataset-table thead th {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-subtle);
    padding: 0;
    text-align: left;
    border-bottom: 1px solid var(--color-border);
}
.dataset-table thead .col-sort {
    width: 100%;
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3);
    font: inherit; color: inherit;
    text-transform: inherit; letter-spacing: inherit;
    text-align: left;
    background: none; border: 0;
    cursor: pointer;
    transition: color var(--transition), background var(--transition);
}
.dataset-table thead .col-sort:hover { color: var(--color-text); background: var(--color-surface); }
.dataset-table thead .col-sort::after {
    content: "";
    width: 8px; height: 12px; flex: 0 0 8px;
    background: currentColor;
    opacity: 0.35;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 0 L8 4 L0 4 Z M4 12 L0 8 L8 8 Z' fill='black'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 0 L8 4 L0 4 Z M4 12 L0 8 L8 8 Z' fill='black'/></svg>") center/contain no-repeat;
}
.dataset-table thead [aria-sort="ascending"] .col-sort,
.dataset-table thead [aria-sort="descending"] .col-sort { color: var(--color-text); }
.dataset-table thead [aria-sort="ascending"] .col-sort::after {
    opacity: 1;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 0 L8 4 L0 4 Z' fill='black'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 0 L8 4 L0 4 Z' fill='black'/></svg>") center/contain no-repeat;
}
.dataset-table thead [aria-sort="descending"] .col-sort::after {
    opacity: 1;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 12 L0 8 L8 8 Z' fill='black'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 12'><path d='M4 12 L0 8 L8 8 Z' fill='black'/></svg>") center/contain no-repeat;
}
.dataset-table tbody td {
    padding: var(--sp-3);
    vertical-align: top;
    border-bottom: 1px solid var(--color-border);
    word-wrap: break-word; overflow-wrap: break-word;
}
.dataset-table tbody tr:last-child td { border-bottom: 0; }
.dataset-table tbody tr:hover { background: var(--color-surface-2); }
.dataset-table tbody td:first-child a { font-weight: 500; }
.dataset-table .col-name { width: 17%; }
.dataset-table .col-rows { width: 8%; }
.dataset-table .col-cols { width: 9%; }
.dataset-table .col-downloads { width: 11%; }
.dataset-table .col-tags { width: 24%; }
.dataset-table tbody td.dataset-rows,
.dataset-table tbody td.dataset-cols,
.dataset-table tbody td.dataset-downloads {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    text-align: right; color: var(--color-text-muted);
}

@media (max-width: 767px) {
    .dataset-table, .dataset-table tbody, .dataset-table tr,
    .dataset-table tbody td { display: block; width: 100%; }
    .dataset-table thead { display: none; }
    .dataset-table { background: transparent; border: 0; box-shadow: none; }
    .dataset-table tbody tr {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        margin-bottom: var(--sp-3);
        padding: var(--sp-3);
    }
    .dataset-table tbody tr:hover { background: var(--color-surface); }
    .dataset-table tbody td { border: 0; padding: var(--sp-1) 0; }
    .dataset-table tbody td:first-child {
        font-family: var(--font-serif); font-size: var(--fs-h4); font-weight: 600;
        margin-bottom: var(--sp-2);
    }
    .dataset-table tbody td.dataset-rows::before {
        content: "Rows ";
        font-family: var(--font-sans); color: var(--color-text-subtle);
        text-transform: uppercase; letter-spacing: 0.08em; font-size: var(--fs-xs);
    }
    .dataset-table tbody td.dataset-cols::before {
        content: "Cols ";
        font-family: var(--font-sans); color: var(--color-text-subtle);
        text-transform: uppercase; letter-spacing: 0.08em; font-size: var(--fs-xs);
    }
    .dataset-table tbody td.dataset-rows,
    .dataset-table tbody td.dataset-cols {
        display: inline-block; margin-right: var(--sp-4); text-align: left;
    }
    .dataset-table tbody td.dataset-downloads { display: none; }
}

/* Homepage search bar */
.visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.dataset-search {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2);
    margin: 0 0 var(--sp-4) 0;
}
.dataset-search input[type="search"] {
    flex: 1 1 240px; min-width: 0;
    padding: var(--sp-2) var(--sp-3);
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius);
    font: inherit; font-size: var(--fs-sm);
    transition: border-color var(--transition), box-shadow var(--transition);
}
.dataset-search input[type="search"]::placeholder { color: var(--color-text-subtle); }
.dataset-search input[type="search"]:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 2px var(--color-accent-soft);
}
.dataset-search__submit {
    padding: var(--sp-2) var(--sp-4);
    background: var(--color-accent); color: var(--color-accent-fg);
    border-radius: var(--radius);
    font-weight: 600; font-size: var(--fs-sm);
    transition: background var(--transition);
}
.dataset-search__submit:hover { background: var(--color-accent-hover); }
.dataset-search__clear {
    font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--color-text-subtle);
}

/* Hero variant — homepage uses this so the primary visitor action
   (search) is the obvious visual anchor. Mirrors the sister literature
   site's `.lit-search--hero`. */
.dataset-search--hero {
    align-items: stretch;
    margin: var(--sp-5) 0 var(--sp-3) 0;
    gap: var(--sp-3);
}
.dataset-search--hero input[type="search"] {
    padding: var(--sp-5) var(--sp-6);
    font-size: 2rem;
    line-height: 1.25;
    border-width: 2px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    min-height: 96px;
}
.dataset-search--hero input:focus {
    box-shadow: 0 0 0 3px var(--color-accent-soft);
}
.dataset-search--hero .dataset-search__submit {
    padding: var(--sp-4) var(--sp-6);
    font-size: 1.25rem;
    border-radius: var(--radius-lg);
    min-width: 140px;
    min-height: 96px;
    box-shadow: var(--shadow);
}
@media (max-width: 768px) {
    .dataset-search--hero input[type="search"] {
        font-size: 1.375rem;
        padding: var(--sp-3) var(--sp-4);
        min-height: 60px;
    }
    .dataset-search--hero .dataset-search__submit {
        font-size: 1rem;
        padding: var(--sp-3) var(--sp-4);
        min-height: 60px;
        min-width: 96px;
    }
}
@media (max-width: 480px) {
    .dataset-search--hero { gap: 8px; }
    .dataset-search--hero input[type="search"] {
        font-size: 1.125rem;
        padding: 10px 12px;
        min-height: 48px;
    }
    .dataset-search--hero .dataset-search__submit {
        font-size: 0.9375rem;
        padding: 10px 14px;
        min-height: 48px;
        min-width: 80px;
    }
}
.dataset-search__summary {
    margin: 0 0 var(--sp-4) 0;
    color: var(--color-text-muted);
    font-size: var(--fs-sm);
}
.dataset-search__empty {
    margin: 0 0 var(--sp-5) 0;
    padding: var(--sp-4);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent);
    border-radius: var(--radius);
    color: var(--color-text-muted);
}

/* Tag-filter intro card */
.tag-summary {
    margin: 0 0 var(--sp-5) 0;
    padding: var(--sp-4);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent);
    border-radius: var(--radius);
}
.tag-summary h3 { margin: 0 0 var(--sp-2) 0; }
.tag-summary p  { margin: 0; color: var(--color-text-muted); }
#special_message { margin: 0 0 var(--sp-5) 0; color: var(--color-text-muted); }
#special_message a { color: var(--color-link); }

/* Detail page */
.detail-grid { display: block; }
@media (min-width: 768px) {
    .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
        gap: var(--sp-6);
        align-items: start;
    }
}
#dataset-content, #dataset-download { min-width: 0; }

.dataset-meta { margin: 0 0 var(--sp-5) 0; }
.dataset-meta dt {
    font-family: var(--font-sans); font-weight: 600;
    font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-subtle);
    margin-top: var(--sp-3);
}
.dataset-meta dd { margin: var(--sp-1) 0 0 0; color: var(--color-text); }
@media (min-width: 600px) {
    .dataset-meta {
        display: grid;
        grid-template-columns: max-content 1fr;
        column-gap: var(--sp-5); row-gap: var(--sp-3);
    }
    .dataset-meta dt { margin-top: 0; padding-top: 2px; }
    .dataset-meta dd { margin: 0; }
}

.download-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--sp-4);
    box-shadow: var(--shadow-sm);
}
.download-card .eyebrow { margin-top: 0; }
.download-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    width: 100%;
    padding: var(--sp-3) var(--sp-4);
    background: var(--color-accent); color: var(--color-accent-fg);
    border-radius: var(--radius);
    font-weight: 600; font-size: var(--fs-base);
    text-decoration: none;
    transition: background var(--transition);
}
.download-cta:hover { background: var(--color-accent-hover); color: var(--color-accent-fg); text-decoration: none; }
.download-cta__type { font-family: var(--font-mono); font-size: var(--fs-sm); opacity: 0.85; }
.download-meta {
    margin: var(--sp-3) 0 0 0;
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    color: var(--color-text-subtle);
    font-variant-numeric: tabular-nums;
}
.download-hint { color: var(--color-text-subtle); font-size: var(--fs-xs); margin: var(--sp-3) 0 0 0; }
.tag-section { margin-top: var(--sp-5); }
.tag-section .eyebrow { margin-bottom: var(--sp-2); }

#downloads-sparkline { width: 100%; max-width: 280px; height: 50px; margin-top: var(--sp-3); }

/* Quickstart code block */
.quickstart { margin-top: var(--sp-6); }
.quickstart__head {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3);
    margin: 0 0 var(--sp-2) 0;
}
.quickstart__head h4 {
    margin: 0;
    font-family: var(--font-sans); font-weight: 600; color: var(--color-text);
}
.code-block {
    margin: 0;
    padding: var(--sp-4);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: var(--fs-sm);
    line-height: 1.55;
    color: var(--color-text);
    box-shadow: var(--shadow-sm);
}
.code-block code { font-family: inherit; white-space: pre; }
.code-copy-btn {
    display: inline-flex; align-items: center; gap: var(--sp-2);
    padding: 4px var(--sp-3);
    border: 1px solid var(--color-border-strong);
    border-radius: 999px;
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.code-copy-btn:hover {
    background: var(--color-surface-2);
    color: var(--color-text);
    border-color: var(--color-accent);
}
.code-copy-btn.is-copied {
    color: var(--color-accent-soft-fg);
    background: var(--color-accent-soft);
    border-color: var(--color-accent);
}
.code-copy-btn__icon {
    width: 14px; height: 14px; display: inline-block;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='9' width='13' height='13' rx='2' ry='2'/><path d='M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='9' width='13' height='13' rx='2' ry='2'/><path d='M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'/></svg>") center/contain no-repeat;
}
.code-copy-btn.is-copied .code-copy-btn__icon {
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
}

.preview-wrapper { margin-top: var(--sp-6); }
.preview-wrapper > h4 { font-family: var(--font-sans); font-weight: 600; color: var(--color-text); }
.preview-scroll {
    overflow-x: auto;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
}
.preview-table {
    width: 100%;
    font-size: var(--fs-sm);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
}
.preview-table th, .preview-table td {
    padding: var(--sp-2) var(--sp-3);
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--color-border);
}
.preview-table thead th {
    position: sticky; top: 0;
    background: var(--color-surface-2);
    color: var(--color-text-subtle);
    font-family: var(--font-sans);
    font-weight: 600; font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em;
    border-bottom: 1px solid var(--color-border-strong);
}
.preview-table tbody tr:nth-child(even) td { background: var(--color-surface-2); }
.preview-table tbody tr:last-child td { border-bottom: 0; }

</style>
<title>{% block title%}{% endblock %}</title>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-title" href="{% url 'datasetapp:dataset-home-page' %}">OpenMV<span class="site-title__dot">·</span>net</a>
        <button id="theme-toggle" type="button" class="theme-toggle"
                aria-label="Toggle color theme" title="Theme: light / dark / auto">
            <span class="theme-toggle__icon" aria-hidden="true"></span>
            <span class="theme-toggle__label">Auto</span>
        </button>
    </div>
</header>
<main class="page-container">
{% block body %}{% endblock %}
</main>
<footer class="site-footer">
    <p>(c) 2010&ndash;{% now "Y" %} Kevin Dunn, <a href="https://learnche.org">learnche.org</a></p>
</footer>

<script>
(function () {
    var KEY = 'openmv-theme';
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var labelEl = btn.querySelector('.theme-toggle__label');
    function mode() {
        var t = null;
        try { t = localStorage.getItem(KEY); } catch (e) {}
        return (t === 'light' || t === 'dark') ? t : 'auto';
    }
    function effective(m) {
        if (m === 'light' || m === 'dark') return m;
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function render(m) {
        btn.setAttribute('data-mode', m);
        if (labelEl) labelEl.textContent = m.charAt(0).toUpperCase() + m.slice(1);
        btn.setAttribute('aria-label', 'Theme: ' + m + ' (click to change)');
    }
    function apply(m) {
        if (m === 'auto') {
            document.documentElement.removeAttribute('data-theme');
            try { localStorage.removeItem(KEY); } catch (e) {}
        } else {
            document.documentElement.setAttribute('data-theme', m);
            try { localStorage.setItem(KEY, m); } catch (e) {}
        }
        render(m);
        document.dispatchEvent(new CustomEvent('themechange', {detail: {mode: m, effective: effective(m)}}));
    }
    render(mode());
    btn.addEventListener('click', function () {
        var order = ['light', 'dark', 'auto'];
        apply(order[(order.indexOf(mode()) + 1) % 3]);
    });
    if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var fn = function () {
            if (mode() === 'auto') {
                document.dispatchEvent(new CustomEvent('themechange', {detail: {mode: 'auto', effective: effective('auto')}}));
            }
        };
        if (mq.addEventListener) mq.addEventListener('change', fn);
        else if (mq.addListener) mq.addListener(fn);
    }
})();
</script>
</body>
</html>
