# Production compose file for openmv.net on a multi-tenant VPS where Caddy
# (host-installed) is the shared reverse proxy. Both services bind to
# loopback only; Caddy is the sole public-facing process.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ports are offset from any other Compose stack on the same host:
#   - openmv-app:      127.0.0.1:8001 -> 8000
#   - openmv-postgres: 127.0.0.1:5434 -> 5432

# Distinct project name keeps `docker compose down` from accidentally
# tearing out a sibling stack on the same VPS that defaults to the same
# project (compose's default project name is the parent directory's
# basename — colocated `/home/deploy/<project>/repo/` checkouts all end
# in `repo/` and would otherwise share one teardown scope).
name: openmv

services:
  db:
    # Pinned by digest so a Docker Hub repoint of postgres:16-alpine can't
    # land silently on the next deploy. Dependabot (`docker` ecosystem in
    # .github/dependabot.yml) opens weekly bump PRs.
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: openmv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openmv_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: openmv-app:latest
    container_name: openmv-app
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: openmv.settings.prod
      SQL_HOST: db
      SQL_PORT: 5432
    volumes:
      # env_file: above already exports every .env key as an environment
      # variable, and openmv/settings/base.py reads os.environ first (since
      # #22 landed in PR #60), so the bind-mount below is no longer required.
      # We keep it as a redundant fallback for the dotenv_values() codepath in
      # base.py — .dockerignore excludes the host .env from the image, so the
      # only way for that fallback to find values is via this bind-mount.
      - ./.env:/app/.env:ro
      - ./data/media:/app/media
      - ./data/static:/app/static
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn openmv.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -

volumes:
  openmv_postgres_data:
