# Local development only. Runs `runserver` against SQLite (matches
# `openmv.settings.dev`). For prod-parity testing (Postgres + gunicorn),
# use `docker-compose.prod.yml` instead.
#
# Usage:
#   cp .env.example .env   # then edit SECRET_KEY etc.
#   docker compose up --build
# Visit http://127.0.0.1:8080/

# Distinct project name keeps `docker compose down` from accidentally
# tearing out a sibling stack on the same VPS that defaults to the same
# project (compose's default project name is the parent directory's
# basename — colocated `/home/deploy/<project>/repo/` checkouts all end
# in `repo/` and would otherwise share one teardown scope).
name: openmv

services:
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: openmv.settings.dev
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    # Override the image's gunicorn CMD with runserver for hot reload.
    command: python manage.py runserver 0.0.0.0:8000
