[project]
name = "openmv"
version = "1.0.0"
description = "The Django site behind https://openmv.net — a public catalogue of small, real-world datasets."
requires-python = ">=3.11"
dependencies = [
    "django>=4.2,<5.0",
    "psycopg2-binary",
    "python-dotenv",
    "gunicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "pre-commit",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "openmv.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
